[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "racevault-api"
version = "0.1.0"
description = "Local evidence retrieval API for RaceVault"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.17,<2",
  "fastapi>=0.135,<0.136",
  "httpx>=0.28,<0.29",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0.46,<3",
  "uvicorn[standard]>=0.41,<0.44",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]
extraction = [
  "docling>=2.119,<3",
  "pymupdf>=1.28,<2",
]
semantic = [
  "torch>=2.8,<3",
  "transformers>=5,<6",
]

[project.scripts]
racevault-extract = "racevault.extraction.cli:main"
racevault-chunk = "racevault.chunking.cli:main"
racevault-lexical = "racevault.lexical.cli:main"
racevault-semantic = "racevault.semantic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/racevault"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider -p no:asyncio"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["racevault"]
