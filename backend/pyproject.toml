[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "racevault-api"
version = "0.1.0"
description = "Local evidence retrieval API for RaceVault"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.17,<2",
  "fastapi>=0.135,<0.136",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0.46,<3",
  "uvicorn[standard]>=0.41,<0.44",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/racevault"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["racevault"]
