services:
  api:
    environment:
      PYTHONPATH: /app/src
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend/src:/app/src:ro
    command:
      - uvicorn
      - racevault.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
