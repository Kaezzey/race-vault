name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
        working-directory: backend
      - run: python -m pytest tests
        working-directory: backend
      - run: python -m ruff check src tests ../scripts
        working-directory: backend
      - run: python -m mypy --config-file pyproject.toml src
        working-directory: backend
      - run: python scripts/run_benchmark.py quick

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.observability.yaml config --quiet
